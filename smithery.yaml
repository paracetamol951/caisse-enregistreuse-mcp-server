startCommand:
  type: http
  configSchema:
    type: object
    properties:
      shopId:
        type: string
        title: Shop ID
        description: >
          Your Kash shop ID (SHOPID). Optional — leave empty and use the
          'authenticate' prompt to log in during the conversation.
      apiKey:
        type: string
        title: API Key
        description: >
          Your Kash API key (APIKEY). Optional — leave empty and use the
          'authenticate' prompt to log in during the conversation.
      language:
        type: string
        title: Language
        description: Language for tool descriptions (en or fr).
        enum: [en, fr]
        default: en
  url: https://mcp.kash.click/mcp